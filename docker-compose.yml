services:
  postgres:
    image: postgres:16-alpine
    container_name: continuing-education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: continuing_education
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d continuing_education"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
